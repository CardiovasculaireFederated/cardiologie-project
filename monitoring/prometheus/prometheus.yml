global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "fl_server"
    static_configs:
      - targets: ["server:8000"]
  - job_name: "client_1"
    static_configs:
      - targets: ["client_1_worker:9101"]
  - job_name: "client_2"
    static_configs:
      - targets: ["client_2_worker:9102"]
  - job_name: "kafka_server"
    static_configs:
      - targets: ["kafka_server:9200"]

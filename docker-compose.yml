version: '3.8'

networks:
  fl_network:
    driver: bridge
    name: fl_network

services:
  # ============================================
  # POSTGRESQL - Base de données
  # ============================================
  postgres_db:
    image: pgvector/pgvector:0.6.2-pg16
    container_name: postgres_card
    environment:
      POSTGRES_DB: database_card
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: cardio111
    ports:
      - "5432:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    networks:
      - fl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d database_card"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # PGADMIN - Interface d'administration
  # ============================================
  pg_admin:
    image: dpage/pgadmin4
    container_name: pgadmin_container  
    ports:
      - "5050:80"  # Changé de 80:80 à 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fl_network
    depends_on:
      - postgres_db
    restart: unless-stopped

  # ============================================
  # ZOOKEEPER - Requis pour Kafka
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # KAFKA BROKER
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fl_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================
  # CLIENTS FEDERATED LEARNING
  # ============================================
  client_1:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8501:8501"
    container_name: fl_client_1
    environment:
      CLIENT_ID: "client_1"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      FL_SERVER_URL: "http://server:8000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fl_network
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  client_2:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8502:8501"
    container_name: fl_client_2
    environment:
      CLIENT_ID: "client_2"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      FL_SERVER_URL: "http://server:8000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fl_network
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ============================================
  # SERVEUR FEDERATED LEARNING
  # ============================================
  kafka_server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: kafka_server
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # IMPORTANT : Utiliser le nom du service, pas localhost
      POSTGRES_HOST: "postgres_db"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "database_card"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "cardio111"
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    volumes:
      - ./best_model.pth:/app/best_model.pth    
    networks:
      - fl_network
    restart: unless-stopped

  # ============================================
  # MONITORING
  # ============================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - fl_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - fl_network
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_db_data:
  pgadmin_data: